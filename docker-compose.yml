services:
  pdf-convert:
    image: ghcr.io/sandavdesigns/pdf-convert:latest
    pull_policy: always
    container_name: pdf-convert
    restart: unless-stopped
    ports:
      - "${PDF_CONVERT_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      APP_SECRET_KEY: "${APP_SECRET_KEY:-}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-100}"
    volumes:
      - pdf-convert-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pdf-convert-data:
