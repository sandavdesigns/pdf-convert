services:
  pdf-convert:
    build:
      context: .
    image: pdf-convert:local
    container_name: pdf-convert
    restart: unless-stopped
    ports:
      - "${PDF_CONVERT_PORT:-8080}:8080"
    environment:
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
